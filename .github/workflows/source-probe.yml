name: Inspect public research sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check bookmaker table schema
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          class P(HTMLParser):
            def __init__(self):
              super().__init__(); self.ts=[]; self.t=None; self.r=None; self.c=None; self.text=[]
            def handle_starttag(self,t,a):
              if t=='table': self.t=[]
              if self.t is not None and t=='tr': self.r=[]
              if self.r is not None and t in ('th','td'): self.c=[]
            def handle_data(self,s):
              self.text.append(s)
              if self.c is not None: self.c.append(s)
            def handle_endtag(self,t):
              if t in ('th','td') and self.c is not None:
                self.r.append(' '.join(''.join(self.c).split())); self.c=None
              elif t=='tr' and self.r is not None and self.t is not None:
                self.t.append(self.r); self.r=None
              elif t=='table' and self.t is not None:
                self.ts.append(self.t); self.t=None
          for book in ('fanduel','draftkings','betmgm','caesars'):
            for league in ('nba','nfl'):
              url=f'https://agentbets.ai/odds/{book}/{league}'
              try:
                html=urlopen(Request(url,headers={'User-Agent':'LineLab/1.0'}),timeout=15).read().decode()
                p=P(); p.feed(html)
                texts=' '.join(' '.join(p.text).split())
                for table in p.ts[:2]: print(book,league,'TABLE',repr(table[:3]))
                x=texts.find('Last updated:')
                print(book,league,'TIMESTAMP',texts[x:x+100])
              except Exception as e: print(book,league,'ERROR',type(e).__name__,str(e)[:80])
          PY
