name: Weekly paper-model research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/research_models.py
      - scripts/research_player_impact.py
      - scripts/research_nba_statistical.py
      - scripts/verify_nba_inference.py
      - scripts/research_nba_boosting.py
      - scripts/research_nba_rotation.py
      - scripts/line_lab/nba_rotation.py
      - scripts/line_lab/nba_efficiency.py
      - scripts/line_lab/nba_statistical.py
      - scripts/line_lab/player_impact.py
      - scripts/evaluate_challengers.py
      - scripts/backtest_shadow.py
      - scripts/research_trust.py
      - scripts/research_patterns.py
      - scripts/research_simulator.py
      - scripts/inspect_simulator_sources.py
      - scripts/research_possession_simulator.py
      - scripts/research_winner_accuracy.py
      - scripts/line_lab/possession_simulator.py
      - scripts/line_lab/position_status_model.py
      - scripts/line_lab/availability_features.py
  schedule:
    - cron: '42 10 * * 2'
permissions:
  contents: write
concurrency:
  group: line-lab-data
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: data/observations
          path: .data-store
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install free research dependencies
        run: pip install -r requirements-research.txt
      - name: Verify research gates
        run: python -m unittest discover -s tests
      - name: Run preregistered research
        env:
          PICKS_DATA_ROOT: ${{ github.workspace }}/.data-store
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_ENABLED: ${{ vars.PROPLINE_ENABLED }}
        run: |
          python scripts/research_patterns.py --data-root "$PICKS_DATA_ROOT" --output PATTERN_REPORT.md
          python scripts/research_models.py --data-root "$PICKS_DATA_ROOT" --output reports/model_registry.md
          OMP_NUM_THREADS=2 python -m scripts.research_nba_rotation --data-root "$PICKS_DATA_ROOT" --output reports/nba_rotation_validation.md
          OMP_NUM_THREADS=2 python -m scripts.research_nba_boosting --data-root "$PICKS_DATA_ROOT" --output reports/nba_boosting_validation.md
          python -m scripts.verify_nba_inference --data-root "$PICKS_DATA_ROOT" --output reports/nba_inference_verification.md
          python -m scripts.research_nba_statistical --data-root "$PICKS_DATA_ROOT" --output reports/nba_statistical_validation.md
          python -m scripts.research_player_impact --data-root "$PICKS_DATA_ROOT" --output reports/player_training_status.md
          python scripts/evaluate_challengers.py --data-root "$PICKS_DATA_ROOT" --output reports/challenger_forward.md
          python scripts/backtest_shadow.py --data-root "$PICKS_DATA_ROOT" --output reports/paper_backtest.md
          python scripts/research_trust.py --data-root "$PICKS_DATA_ROOT" --output reports/trust_timing.md
          python -m scripts.research_simulator --data-root "$PICKS_DATA_ROOT" --output reports/simulation_validation.md
          python -m scripts.inspect_simulator_sources --data-root "$PICKS_DATA_ROOT" --output reports/simulator_source_schema.md
          python -m scripts.research_possession_simulator --data-root "$PICKS_DATA_ROOT" --output reports/scoring_process_validation.md
          python -m scripts.research_winner_accuracy --data-root "$PICKS_DATA_ROOT" --output reports/winner_accuracy_replay.md
      - name: Append research logs
        run: |
          git -C .data-store config user.name 'github-actions[bot]'
          git -C .data-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .data-store add observations
          if ! git -C .data-store diff --cached --quiet; then
            git -C .data-store commit -m 'Record weekly shadow research'
            git -C .data-store pull --rebase origin data/observations
            git -C .data-store push origin HEAD:data/observations
          fi
      - name: Publish research summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nba_inference_verification.md reports/nba_rotation_validation.md reports/nba_boosting_validation.md reports/nba_statistical_validation.md PATTERN_REPORT.md reports/model_registry.md reports/player_training_status.md reports/challenger_forward.md reports/paper_backtest.md reports/trust_timing.md reports/simulation_validation.md reports/simulator_source_schema.md reports/scoring_process_validation.md reports/winner_accuracy_replay.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update weekly research summaries'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
