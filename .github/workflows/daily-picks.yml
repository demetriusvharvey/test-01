name: Update picks and scorecard
on:
  workflow_dispatch:
  schedule:
    - cron: '9 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/pipeline.py'
      - 'scripts/line_lab/**'
      - 'tests/**'
      - '.github/workflows/daily-picks.yml'
permissions:
  contents: write
concurrency:
  group: line-lab-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: data/observations
          path: .data-store
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test prediction and grading rules
        run: python -m unittest discover -s tests
      - name: Update ratings, prices and results
        env:
          PICKS_DATA_ROOT: ${{ github.workspace }}/.data-store
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_FEATURED_MARKETS: ${{ vars.ODDS_API_FEATURED_MARKETS }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_INJURY_ENABLED: ${{ vars.PROPLINE_INJURY_ENABLED }}
        run: python scripts/pipeline.py
      - name: Commit append-only observations
        run: |
          git -C .data-store config user.name 'github-actions[bot]'
          git -C .data-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .data-store add observations
          if ! git -C .data-store diff --cached --quiet; then
            git -C .data-store commit -m 'Append observed odds and closing proxies'
            git -C .data-store pull --rebase origin data/observations
            git -C .data-store push origin HEAD:data/observations
          fi
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/board.json data/predictions.json data/referee_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update picks and scorecard'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
