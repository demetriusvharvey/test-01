name: Backfill source snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill.py'
      - 'scripts/line_lab/backfill.py'
permissions:
  contents: write
concurrency:
  group: line-lab-data
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: data/observations
          path: .data-store
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Fetch and validate retrospective files
        id: backfill
        continue-on-error: true
        env:
          PICKS_DATA_ROOT: ${{ github.workspace }}/.data-store
        run: python scripts/backfill.py
      - name: Preserve successful source snapshots
        if: always() && steps.backfill.outcome != 'skipped'
        run: |
          git -C .data-store config user.name 'github-actions[bot]'
          git -C .data-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d .data-store/observations ]; then
            git -C .data-store add observations
          fi
          if ! git -C .data-store diff --cached --quiet; then
            git -C .data-store commit -m 'Archive attributed retrospective source snapshots'
            git -C .data-store pull --rebase origin data/observations
            git -C .data-store push origin HEAD:data/observations
          fi
      - name: Report incomplete backfill
        if: steps.backfill.outcome == 'failure'
        run: exit 1
