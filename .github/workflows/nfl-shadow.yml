name: Refresh NFL shadow context
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_nfl_shadow.py'
      - 'scripts/line_lab/nfl_shadow.py'
      - 'scripts/line_lab/availability.py'
permissions:
  contents: write
concurrency:
  group: line-lab-data
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: data/observations
          path: .data-store
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test source and leakage checks
        run: python -m unittest discover -s tests
      - name: Capture descriptive QB data
        env:
          PICKS_DATA_ROOT: ${{ github.workspace }}/.data-store
        run: python scripts/refresh_nfl_shadow.py
      - name: Save snapshot
        run: |
          git -C .data-store config user.name 'github-actions[bot]'
          git -C .data-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d .data-store/observations/nfl_qb ]; then
            git -C .data-store add observations/nfl_qb
          fi
          if [ -d .data-store/observations/nfl_availability ]; then
            git -C .data-store add observations/nfl_availability
          fi
          if ! git -C .data-store diff --cached --quiet; then
            git -C .data-store commit -m 'Append NFL quarterback shadow context'
            git -C .data-store pull --rebase origin data/observations
            git -C .data-store push origin HEAD:data/observations
          fi
