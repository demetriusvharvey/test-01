name: Update picks and scorecard
on:
  workflow_dispatch:
  schedule:
    - cron: '9 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/pipeline.py'
      - 'tests/test_pipeline.py'
      - '.github/workflows/daily-picks.yml'
permissions:
  contents: write
concurrency:
  group: line-lab-picks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test prediction and grading rules
        run: python -m unittest discover -s tests
      - name: Update ratings, prices and results
        run: python scripts/pipeline.py
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/board.json data/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update picks and scorecard'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
